name: Deploy · Production

# Two triggers:
#   1. Automatic — when CI passes on main (still requires environment approval)
#   2. Manual    — workflow_dispatch with optional SHA override
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"
      skip_healthcheck:
        description: "Skip post-deploy health check (emergency only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  # Gate: CI must have passed for workflow_run trigger
  check-ci:
    name: "Gate · CI passed"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI status
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — skipping CI conclusion check"
          else
            echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "Proceeding to production deploy ✅"
          fi

  deploy-production:
    name: "Deploy → production"
    runs-on: ubuntu-latest
    needs: check-ci
    # Infra gate: the VPS + deploy secrets (PROD_HOST/PROD_USER/PROD_SSH_KEY)
    # are not provisioned yet. Until the repo variable PRODUCTION_DEPLOY_ENABLED
    # is set to 'true' (Settings → Variables), this job is skipped instead of
    # failing every push on missing SSH credentials. Flip it on once the
    # server and secrets are configured.
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}

    # GitHub Environment with required reviewers configured in repo settings:
    # Settings → Environments → production → Required reviewers
    # This creates the manual approval gate before the job runs.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

    steps:
      - name: Deployment summary
        run: |
          echo "## Production Deploy 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.event.workflow_run.head_sha || github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

      # ── Deploy via SSH (docker-compose rolling update) ─────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.PROD_DEPLOY_PATH }}"
            TAG="${{ env.IMAGE_TAG }}"
            # GHCR repo names must be lowercase; github.repository keeps the
            # owner's original case (IceFice) — lowercase it to match the
            # images docker/metadata-action pushed.
            REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            cd "$APP_DIR"

            echo "▶ Sync deploy assets (compose, nginx, migrations)"
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "▶ Log in to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "▶ Pin image tags ($TAG) in .env"
            sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=${REPO}/backend:${TAG}#"  .env
            sed -i "s#^FRONTEND_IMAGE=.*#FRONTEND_IMAGE=${REPO}/frontend:${TAG}#" .env

            echo "▶ Pull new images"
            $COMPOSE pull backend frontend

            echo "▶ Apply stack (postgres/redis stay up; backend+nginx recreate)"
            $COMPOSE up -d --remove-orphans

            echo "▶ Wait for backend health"
            for i in $(seq 1 18); do
              if $COMPOSE exec -T backend node -e "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
                echo "  backend healthy ✅ (attempt $i)"; break
              fi
              [ "$i" -eq 18 ] && { echo "❌ backend unhealthy — recent logs:"; $COMPOSE logs --tail=50 backend; exit 1; }
              echo "  attempt $i/18 — waiting 5s…"; sleep 5
            done

            echo "▶ Prune dangling images"
            docker image prune -f \
              --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              2>/dev/null || true

            echo ""
            echo "✅ Production deploy complete (tag: $TAG)"

      # ── Post-deploy health check from runner ────────────────────────────────
      - name: Post-deploy health check
        if: ${{ github.event.inputs.skip_healthcheck != 'true' }}
        run: |
          echo "Running external health check..."
          for i in $(seq 1 6); do
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" \
              "${{ vars.PROD_URL }}/health" 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Production health check passed (HTTP $HTTP)"
              exit 0
            fi
            echo "Attempt $i/6 — HTTP $HTTP"
            sleep 10
          done
          echo "❌ Production health check failed"
          exit 1

      # ── Slack: success ──────────────────────────────────────────────────────
      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL — skipping notification"; exit 0; }
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ *Production deploy succeeded* 🚀",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Image tag",    "value": "${{ env.IMAGE_TAG }}", "short": true},
                  {"title": "Deployed by",  "value": "${{ github.actor }}",  "short": true},
                  {"title": "URL",          "value": "${{ vars.PROD_URL }}",  "short": true},
                  {"title": "Run",
                   "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                   "short": false}
                ]
              }]
            }'

      # ── Slack: failure ──────────────────────────────────────────────────────
      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL — skipping notification"; exit 0; }
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🔴 *PRODUCTION DEPLOY FAILED* — immediate attention required",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Image tag",   "value": "${{ env.IMAGE_TAG }}", "short": true},
                  {"title": "Triggered by","value": "${{ github.actor }}",  "short": true},
                  {"title": "Run",
                   "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                   "short": false}
                ]
              }]
            }'
