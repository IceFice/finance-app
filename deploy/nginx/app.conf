# Finance App — public entrypoint (HTTP).
# Serves the React SPA and reverse-proxies the API to the backend container.
# Switch to HTTPS with deploy/enable-ssl.sh once DNS points at the VPS.

# Rate-limit zone for the API (defence-in-depth; app also rate-limits).
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker's embedded DNS. Combined with a variable in proxy_pass this
    # defers backend name resolution to request time, so nginx still
    # starts (and auto-recovers) even if the backend is briefly down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $finance_backend "http://backend:4000";

    # ── Let's Encrypt http-01 challenge (kept open even after SSL) ───────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ── Container healthcheck (local only) ──────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Upload ceiling (CSV import etc.)
    client_max_body_size 10m;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/wasm;

    # ── API → backend container ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;

        proxy_pass         $finance_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Backend liveness endpoint (not under /api)
    location = /health {
        proxy_pass         $finance_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── React SPA (static, client-side routing) ─────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
