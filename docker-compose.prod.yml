name: finance-app

# Production stack for a single small VPS (1 vCPU / 2 GB / Ubuntu 24).
# Public entrypoint is the nginx (frontend) container on :80/:443.
# Postgres and Redis are NOT published — they live on the internal bridge
# network only. All variables come from the sibling `.env` file
# (see deploy/.env.production.example).
#
# OOM hardening (why mem_limit AND deploy.resources):
#   `deploy.resources.limits` is only enforced under Swarm. Plain
#   `docker compose up` honours the top-level `mem_limit` / `mem_reservation`
#   keys instead. We set BOTH so the cap is enforced no matter how the stack
#   is launched. Hard per-container caps mean a runaway container is OOM-killed
#   inside its own cgroup — the host (and sshd!) stays alive. Sum of limits
#   (~1.15 GB) leaves ~0.85 GB for the OS on a 2 GB box, plus swap as cushion.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"   # cap each container's logs so they can't fill the disk
    max-file: "3"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Tuned for a small container on a 1 vCPU / 2 GB VPS so Postgres can't
    # balloon and OOM-kill the rest of the stack.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs every migration in order on FIRST init (empty data dir only).
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 448m
    mem_reservation: 256m
    deploy:
      resources:
        limits:
          memory: 448m

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --save 60 1 --appendonly yes --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 160m
    mem_reservation: 64m
    deploy:
      resources:
        limits:
          memory: 160m

  # ── Backend API (image from ghcr.io, internal only) ─────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/icefice/finance-app/backend:latest}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Cap the V8 heap below the container limit so Node GCs instead of
      # growing past the cgroup cap and getting OOM-killed.
      NODE_OPTIONS: "--max-old-space-size=320"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 448m
    mem_reservation: 256m
    deploy:
      resources:
        limits:
          memory: 448m

  # ── nginx: serves SPA + reverse-proxies /api (public entrypoint) ────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/icefice/finance-app/frontend:latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Host-mounted nginx config so SSL can be toggled without a rebuild
      # (deploy/enable-ssl.sh swaps app.conf → app.ssl.conf and reloads).
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    depends_on:
      - backend
    mem_limit: 96m
    mem_reservation: 32m
    deploy:
      resources:
        limits:
          memory: 96m

volumes:
  postgres_data:
  redis_data:
