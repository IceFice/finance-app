name: finance-app

# Production stack for a single small VPS (1 vCPU / 2 GB / Ubuntu 24).
# Public entrypoint is the nginx (frontend) container on :80/:443.
# Postgres and Redis are NOT published — they live on the internal bridge
# network only. All variables come from the sibling `.env` file
# (see deploy/.env.production.example).

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs every migration in order on FIRST init (empty data dir only).
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768m

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192m

  # ── Backend API (image from ghcr.io, internal only) ─────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/icefice/finance-app/backend:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ── nginx: serves SPA + reverse-proxies /api (public entrypoint) ────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/icefice/finance-app/frontend:latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Host-mounted nginx config so SSL can be toggled without a rebuild
      # (deploy/enable-ssl.sh swaps app.conf → app.ssl.conf and reloads).
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres_data:
  redis_data:
